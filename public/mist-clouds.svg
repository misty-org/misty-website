<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <filter id="cloud" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <!-- Broad rolling banks with irregular wispy detail; the extra octaves add the fine
           texture that keeps the clouds crisp when the tile is stretched across the page.
           Continuous density avoids the clipped, smoky edges of a threshold. -->
      <feTurbulence type="fractalNoise" baseFrequency=".003 .008" numOctaves="6" seed="18" stitchTiles="stitch" result="banks"/>
      <feTurbulence type="fractalNoise" baseFrequency=".009 .016" numOctaves="5" seed="7" stitchTiles="stitch" result="wisps"/>
      <feDisplacementMap in="banks" in2="wisps" scale="65" xChannelSelector="R" yChannelSelector="G"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .65  0 0 0 0 .65  0 0 0 0 .67  .8 .8 .8 0 -.68"/>
      <feComponentTransfer>
        <feFuncA type="gamma" amplitude=".7" exponent="2.4" offset="0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <linearGradient id="fade" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white" stop-opacity=".8"/>
      <stop offset=".5" stop-color="white"/>
      <stop offset=".8" stop-color="white" stop-opacity=".7"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-sides">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".22" stop-color="white"/>
      <stop offset=".78" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="800">
      <rect width="1600" height="800" fill="url(#fade)"/>
    </mask>
    <mask id="sides" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="800">
      <rect width="1600" height="800" fill="url(#fade-sides)"/>
    </mask>
  </defs>
  <g mask="url(#edge)">
    <g mask="url(#sides)"><rect width="1600" height="800" filter="url(#cloud)"/></g>
  </g>
</svg>
