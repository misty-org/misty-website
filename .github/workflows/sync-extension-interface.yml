name: Sync extension interface

on:
  repository_dispatch:
    types:
      - extension-interface-updated
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-extension-interface
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize catalog and interface
        run: npm run sync:extensions

      - name: Verify website catalog
        run: |
          npm run typecheck
          npm test

      - name: Commit synchronized sources
        run: |
          if git diff --quiet -- src/content/extensions.generated.json src/generated/extensions; then
            echo "The website extension interface is already current."
            exit 0
          fi
          git config user.name "misty-interface-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/extensions.generated.json src/generated/extensions
          git commit -m "chore: sync extension interface"
          git push
